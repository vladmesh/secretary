# Portable spec for the retro triggered-agent.
#
# The canon for HOW the retro agent is dispatched. Its schedule is the packaged systemd timer
# (secretary-retro.timer), the only schedule owner; Secretary manages no Orca automation.

name = "retro"
skill = "/retro"          # prompt = skill invocation (skill lives in .claude/skills/retro)
# Last resort only — `role_defaults.retro` in the selected head registry decides the real head.
head = "claude-opus-medium"
# Skip the run when no session has new turns since the watermark. Gated in the systemd unit.
precheck = "python3 -P -m secretary automations retro precheck"

[systemd]
# The only scheduler; packaged as secretary-<name>.timer. Retro is a
# slow reflective pass, so daily (not hourly like curator/board).
calendar = "daily"
randomized_delay_sec = 300   # jitter so the daily retro pass never races another sweep at midnight
