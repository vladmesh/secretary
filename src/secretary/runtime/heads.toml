# The product's portable default head registry — the fallback for an installation that has not
# written its own. An installation owns its heads by putting `heads/heads.toml` in its instance
# directory; `secretary upgrade` prefers that file and only falls back here. So this file stays
# deliberately small: the five pipeline tiers on a Claude subscription and an OpenAI subscription,
# and nothing that encodes one installation's account policy or spend decisions.
#
# A resource is a shared account/limit a head draws from (probe is a health-check command for that
# resource, run on a TTL by secretary.head_health — red lives on the resource, every profile drawing
# from it inherits that redness). A profile names its resource, an adapter (which render_<adapter>
# in heads.py turns role+prompt into a launch command), and an ordered fallback chain of other
# profile ids walked at claim time when the preferred profile's resource is red or spent — by
# head_health.resolve_head_chain, for the triggered agents and for cards alike. It walks it
# breadth-first and stops at one answer: nothing launchable in the chain means the
# card is not claimed at all, rather than a head being started into a dead account.
# [role_defaults] names the head each role runs on; every consumer — the dispatcher's worker,
# reviewer and observer routing and the curator/retro/steward launch selection — reads that one
# table, so no two of them can disagree about which head a role is on.
#
# Adding a head (another model, another runtime) is a new [profiles.<id>] entry plus, only if its
# launch shape is genuinely new, one more render_<adapter> function in heads.py — the dispatcher
# and worker.py never change.

[resources.claude-sub]
# A Claude subscription reached through the OAuth-authenticated `claude` CLI — one account, no
# per-profile credential. Probe: one real haiku token through that CLI (resource_probe.probe_claude_sub),
# red exactly during a subscription rate-limit or an API outage, free the rest of the time (once
# per head_health.PROBE_TTL_SECONDS, not per tick).
account = "claude-subscription"
probe = "python3 -P -m secretary.runtime.resource_probe --resource claude-sub"

[resources.openai-sub]
# An OpenAI/ChatGPT subscription reached through the native `codex` CLI, mirroring claude-sub.
# Authed once with `codex login` into the active CODEX_HOME (codex_preflight.resolve_codex_home:
# `<data_dir>/codex-home` once it holds a login, else the legacy Orca home), which also holds MCP,
# skills, hooks and the global agent instructions. Probe: one real `codex exec` token
# through that home (resource_probe.probe_openai_sub).
account = "openai-subscription"
probe = "python3 -P -m secretary.runtime.resource_probe --resource openai-sub"

# Profile ids are `<family>-<model>-<effort>`, and the pipeline runs on exactly these five tiers:
# Codex on Terra at high, Codex on Sol at medium and high, Claude Opus at medium and high. Each
# falls back to the tier of the other family at comparable class, so a host whose one subscription
# is red — or that never had it — keeps running without editing this file. Comparable is the whole
# of the rule: a chain to a head that is merely cheaper is what burned three worker attempts
# overnight on 2026-07-04.
#
# Every Codex tier is `codex_mode = "tui"`: an interactive session the launcher brings up empty and
# then sends the prompt into. It is stated on each profile rather than left to the default so the
# generated installation snapshot says it too; the one-shot `codex exec` head is gone from the
# product (secretary-1173), and a profile naming it is refused when the registry is validated.
#
# No tier names a `runtime`: a profile that names none is held by this product's own supervisor
# (DEFAULT_HEAD_RUNTIME in runtime/head_runtimes.py), the only head runtime there is. The Orca one
# was removed by A20 step 2 (docs/HEAD_RUNTIME.md), and a registry whose profile still names
# `orca-legacy` is refused when it loads.

[profiles.codex-terra-high]
resource = "openai-sub"
adapter = "codex"
model = "gpt-5.6-terra"
effort = "high"
codex_mode = "tui"
fallback = ["claude-opus-high"]

[profiles.codex-sol-medium]
resource = "openai-sub"
adapter = "codex"
model = "gpt-6-sol"
effort = "medium"
codex_mode = "tui"
fallback = ["claude-opus-medium"]

[profiles.codex-sol-high]
resource = "openai-sub"
adapter = "codex"
model = "gpt-6-sol"
effort = "high"
codex_mode = "tui"
fallback = ["claude-opus-high"]

[profiles.claude-opus-medium]
resource = "claude-sub"
adapter = "claude"
model = "opus"
effort = "medium"
fallback = ["codex-sol-medium"]

[profiles.claude-opus-high]
resource = "claude-sub"
adapter = "claude"
model = "opus"
effort = "high"
fallback = ["codex-terra-high"]

[role_defaults]
# Which head each role runs on. The reviewer is of the other family from new_card, so a card is
# never reviewed by the model that wrote it. An installation that wants different tiers per role
# repoints these in its own canon rather than editing the product.
new_card = "claude-opus-medium"
reviewer = "codex-terra-high"
observer = "claude-opus-high"
curator = "codex-sol-medium"
retro = "claude-opus-medium"
steward = "codex-sol-high"
