# The product's portable default head registry — the fallback for an installation that has not
# written its own. An installation owns its heads by putting `heads/heads.toml` in its instance
# directory; `secretary upgrade` prefers that file and only falls back here. So this file stays
# deliberately small and neutral: enough to bring a clean host up on a Claude subscription, an
# OpenAI subscription, or both, and nothing that encodes one installation's account policy, model
# choices or spend decisions.
#
# A resource is a shared account/limit a head draws from (probe is a health-check command for that
# resource, run on a TTL by pipeline/health.py — red lives on the resource, every profile drawing
# from it inherits that redness). A profile names its resource, an adapter (which render_<adapter>
# in heads.py turns role+prompt into a launch command), and an ordered fallback chain of other
# profile ids walked at claim time when the preferred profile's resource is red or spent — by
# health.resolve_head for the triggered agents, by the dispatcher's own resolver for cards. Both
# walk it breadth-first and both stop at the same answer: nothing launchable in the chain means the
# card is not claimed at all, rather than a head being started into a dead account.
# [role_defaults] names the head each role runs on; every consumer — the dispatcher's worker,
# reviewer and observer routing and the curator/retro/steward launch selection — reads that one
# table, so no two of them can disagree about which head a role is on.
#
# Adding a head (another model, another runtime) is a new [profiles.<id>] entry plus, only if its
# launch shape is genuinely new, one more render_<adapter> function in heads.py — the dispatcher
# and worker.py never change.

[resources.claude-sub]
# A Claude subscription reached through the OAuth-authenticated `claude` CLI — one account, no
# per-profile credential. Probe: one real haiku token through that CLI (health.probe_claude_sub),
# red exactly during a subscription rate-limit or an API outage, free the rest of the time (once
# per health.PROBE_TTL_S, not per tick).
account = "claude-subscription"
probe = "python3 -P -m triggered_agents pipeline probe --resource claude-sub"

[resources.openai-sub]
# An OpenAI/ChatGPT subscription reached through the native `codex` CLI, mirroring claude-sub.
# Authed once with `codex login` into the Orca-managed CODEX_HOME (heads.CODEX_HOME), which also
# holds MCP, skills, hooks and the global agent instructions. Probe: one real `codex exec` token
# through that home (health.probe_openai_sub).
account = "openai-subscription"
probe = "python3 -P -m triggered_agents pipeline probe --resource openai-sub"

# Claude heads. They are the fallback the codex heads below walk to, and since 2026-08-06 they
# name the return chain too: a spent claude-sub sends a card to the codex head of comparable class
# rather than leaving it in Ready until the subscription resets (secretary-1165). Comparable is the
# whole of the rule. A chain to a head that is merely cheaper is what burned three worker attempts
# overnight on 2026-07-04, and that decision stands: what changed is that a head of another family
# at the same class is not the weaker head that decision was about.

[profiles.claude-default]
# Bare `claude --dangerously-skip-permissions <prompt>`, no --model flag: whatever the CLI's own
# default model is. The one profile that keeps working when a named model is retired.
resource = "claude-sub"
adapter = "claude"
fallback = ["codex"]

[profiles.claude-sonnet]
resource = "claude-sub"
adapter = "claude"
model = "sonnet"
fallback = ["codex"]

[profiles.claude-opus]
resource = "claude-sub"
adapter = "claude"
model = "opus"
fallback = ["codex-high"]

[profiles.claude-opus-medium]
resource = "claude-sub"
adapter = "claude"
model = "opus"
effort = "medium"
fallback = ["codex"]

[profiles.claude-observer]
# The observer's Claude head is a profile of its own rather than a pointer at claude-opus: the
# observer slices cards and judges drift from the sprint goal, so its head stays a deliberate
# choice and not whatever the worker default happens to be.
resource = "claude-sub"
adapter = "claude"
model = "opus"
fallback = ["codex-observer"]

[profiles.claude-observer-medium]
resource = "claude-sub"
adapter = "claude"
model = "opus"
effort = "medium"
fallback = ["codex-observer"]

# Codex heads. Each falls back to its Claude counterpart, so a host whose OpenAI subscription is
# red — or that never had one — keeps running without editing this file.
#
# Every one of them is `codex_mode = "tui"`: an interactive session the launcher brings up empty
# and then sends the prompt into. It is stated on each profile rather than left to the default so
# the generated installation snapshot says it too, and it is the only mode there is — the one-shot
# `codex exec` head is gone from the product (secretary-1173), so a profile naming it is refused
# when the registry is validated.

[profiles.codex]
# Stable default id for the native OpenAI head, at the model's own default reasoning effort. No
# `model` pin: the product does not choose which model an installation pays for, and the CLI's
# default is the one id that cannot go stale when a model is retired.
resource = "openai-sub"
adapter = "codex"
effort = "default"
codex_mode = "tui"
fallback = ["claude-sonnet"]

[profiles.codex-high]
# Explicit high reasoning for harder implementation and debug work.
resource = "openai-sub"
adapter = "codex"
effort = "high"
codex_mode = "tui"
fallback = ["claude-opus"]

[profiles.codex-reviewer]
# Layer-3 reviewer: extra reasoning (Codex CLI value: xhigh), Claude second so a review is still
# possible on a single-subscription host.
resource = "openai-sub"
adapter = "codex"
effort = "extra"
codex_mode = "tui"
fallback = ["claude-opus"]

[profiles.codex-curator]
# Curator is the memory canon's writer.  It gets the dedicated Terra xhigh profile, while a red
# OpenAI subscription still falls back to the deliberately generic Claude profile that can run on
# a clean single-subscription host.
resource = "openai-sub"
adapter = "codex"
model = "gpt-5.6-terra"
effort = "extra"
codex_mode = "tui"
fallback = ["claude-default"]

[profiles.codex-observer]
# Sprint observer: one long-lived head per open sprint, launched by the dispatcher and held until
# the sprint closes. It was the first head held to an interactive session, because the observer is
# one continuous session for the whole sprint — a one-shot head would exit after its first turn and
# the tick would read that as a dead head every time.
resource = "openai-sub"
adapter = "codex"
effort = "extra"
codex_mode = "tui"
fallback = ["claude-observer"]

[role_defaults]
# Which head each role runs on. An installation that wants different models, efforts or accounts
# per role repoints these in its own canon rather than editing the product.
new_card = "codex"
reviewer = "codex-reviewer"
observer = "codex-observer"
curator = "codex-curator"
retro = "codex"
steward = "codex-high"
