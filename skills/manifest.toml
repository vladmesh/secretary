[roles.secretary]
skills = [
  "open-sprint",
  "start-sprint",
  "run-sprint",
  "spec-card",
  "knowledge-doc",
  "grilling",
  "grill-me",
  "thermo-nuclear-code-quality-review",
  "orchestration",
  "computer-use",
]

[roles.curator]
skills = ["curate"]

[roles.retro]
skills = ["retro"]

[roles.steward]
skills = ["steward"]

# The sprint observer head. Delivered to the shells its head profiles can come up in
# (`role_defaults.observer` and the fallback chain in triggered_agents/agents/pipeline/heads.toml),
# because the dispatcher refuses to launch a head into a shell without this skill.
[roles.observer]
skills = ["observe-sprint"]

[targets.claude-secretary-global]
shell = "claude"
root = "/home/dev/.claude/skills"
roles = ["secretary"]

[targets.codex-orca-secretary]
shell = "codex"
root = "/home/dev/.config/orca/codex-runtime-home/home/skills"
roles = ["secretary"]

[targets.hermes-secretary]
shell = "hermes"
root = "/home/dev/.hermes/skills/secretary"
roles = ["secretary"]

[targets.claude-secretary-curator]
shell = "claude"
root = "/home/dev/orca/workspaces/secretary/curator/.claude/skills"
roles = ["curator"]

[targets.claude-secretary-retro]
shell = "claude"
root = "/home/dev/orca/workspaces/secretary/retro/.claude/skills"
roles = ["retro"]

[targets.claude-secretary-steward]
shell = "claude"
root = "/home/dev/orca/workspaces/secretary/steward/.claude/skills"
roles = ["steward"]

[targets.claude-secretary-observer]
shell = "claude"
# The observer's workspace is created per sprint, so its skill cannot be delivered into a fixed
# workspace the way curator, retro and steward are. It goes to the shell-wide root instead, which
# is where a claude observer head will look for it whatever sprint it comes up on.
root = "/home/dev/.claude/skills"
roles = ["observer"]

[targets.codex-secretary-roles]
shell = "codex"
root = "/home/dev/.config/orca/codex-runtime-home/home/skills"
roles = ["curator", "retro", "steward", "observer"]

[targets.hermes-secretary-roles]
shell = "hermes"
root = "/home/dev/.hermes/skills/secretary-roles"
roles = ["curator", "retro", "steward"]
