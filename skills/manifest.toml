# The portable role-skill registry. Roles and skills every installation gets, delivered into the
# shell roots below by `secretary role-skills sync`.
#
# An installation may own a second manifest at `<instance>/skills/manifest.toml` whose skills sit
# in the `roles/` tree beside it; those entries are layered over these (secretary/role_skills.py).
# Anything that only makes sense on one host — a bridge to that operator's own browser, a tool
# bound to their accounts — belongs there, not here.
#
# Target roots are written home-relative on purpose: the product does not know which user runs it.

[roles.secretary]
skills = [
  "open-sprint",
  "start-sprint",
  "run-sprint",
  "spec-card",
  "knowledge-doc",
  "grilling",
  "grill-me",
  "thermo-nuclear-code-quality-review",
  "orchestration",
  "computer-use",
]

[roles.curator]
skills = ["curate"]

[roles.retro]
skills = ["retro"]

[roles.steward]
skills = ["steward"]

# The sprint observer head. Delivered to the shells its head profiles can come up in
# (`role_defaults.observer` and the fallback chain in the head registry), because the dispatcher
# refuses to launch a head into a shell without this skill.
[roles.observer]
skills = ["observe-sprint"]

[targets.claude-secretary-global]
shell = "claude"
root = "~/.claude/skills"
roles = ["secretary"]

[targets.codex-orca-secretary]
shell = "codex"
root = "~/.config/orca/codex-runtime-home/home/skills"
roles = ["secretary"]

[targets.hermes-secretary]
shell = "hermes"
root = "~/.hermes/skills/secretary"
roles = ["secretary"]

[targets.claude-secretary-curator]
shell = "claude"
root = "~/orca/workspaces/secretary/curator/.claude/skills"
roles = ["curator"]

[targets.claude-secretary-retro]
shell = "claude"
root = "~/orca/workspaces/secretary/retro/.claude/skills"
roles = ["retro"]

[targets.claude-secretary-steward]
shell = "claude"
root = "~/orca/workspaces/secretary/steward/.claude/skills"
roles = ["steward"]

[targets.claude-secretary-observer]
shell = "claude"
# The observer's workspace is created per sprint, so its skill cannot be delivered into a fixed
# workspace the way curator, retro and steward are. It goes to the shell-wide root instead, which
# is where a claude observer head will look for it whatever sprint it comes up on.
root = "~/.claude/skills"
roles = ["observer"]

[targets.codex-secretary-roles]
shell = "codex"
root = "~/.config/orca/codex-runtime-home/home/skills"
roles = ["curator", "retro", "steward", "observer"]

[targets.hermes-secretary-roles]
shell = "hermes"
root = "~/.hermes/skills/secretary-roles"
roles = ["curator", "retro", "steward"]
