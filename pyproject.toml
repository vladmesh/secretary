[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv]
# This installation is managed by the product's venv/pip bootstrap and upgrade
# path. Keep incidental `uv run` invocations from creating a second dependency
# authority (`uv.lock`) or resynchronizing the production environment.
managed = false

[tool.ruff]
target-version = "py312"
# The linter is part of the contract, so its version is too: a rule set that means one thing
# on the author's machine and another in a gate is not a gate. `required-version` makes any
# other ruff refuse to run instead of silently reporting a different set of findings; install
# the matching one with `pip install -e '.[dev]'`.
required-version = "==0.16.4"
# The formatter's width, chosen from what the tree already is rather than from the default:
# p95 of the existing lines is 97 columns and p99 is 105, so 88 would rewrap working code for
# no reason. Long prose and command examples in comments and strings are not reflowed at all,
# which is why the lint side still ignores E501.
line-length = 110

[tool.ruff.lint]
# Keep the initial debt finite and explicit. These are the rules that find issues in
# the existing codebase; broad families add unrelated style churn before this debt is
# worked down.
select = [
    "B009", "B010", "B017", "B018", "B023",
    "BLE001",
    "C408", "C414",
    "DTZ003",
    "EXE001",
    "F401", "F541", "F811", "F821", "F841",
    "FLY002",
    "FURB105", "FURB162", "FURB167", "FURB188",
    "I001",
    "ISC004",
    "PERF101", "PERF102",
    "PIE810",
    "PLR0402", "PLW1510",
    "PYI034", "PYI041",
    "RUF010", "RUF012", "RUF015", "RUF022", "RUF059", "RUF100",
    "S110",
    "SIM102", "SIM117", "SIM401",
    "TRY004",
    "UP012", "UP017", "UP022", "UP031", "UP033", "UP034", "UP035", "UP037",
]

# `assert` is unittest's assertion API, and this project deliberately keeps long
# protocol prose and command examples intact instead of wrapping them for a column limit.
ignore = ["E501", "S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
# Start with typed leaves only. Imported legacy modules are followed for type information, but
# their existing debt is not promoted into this first gate; the checked set grows deliberately.
files = [
    "src/secretary/board/models.py",
    "src/secretary/board/roles.py",
    "src/secretary/board/attempt_usage.py",
    "src/secretary/board/attempt_outcome.py",
    "src/secretary/board/outcome_round_context.py",
    "src/secretary/board/card_transitions.py",
    "src/secretary/board/task_routing.py",
    "src/secretary/board/sprint_read.py",
    "src/secretary/board/sprint_admission.py",
    "src/secretary/board/sprint_write.py",
    "src/secretary/board/sprint_close.py",
    "src/secretary/board/host.py",
    "src/secretary/board/backend.py",
    "src/secretary/dispatch/runtime_provenance.py",
    "src/secretary/dispatch/attempt_accounting.py",
    "src/secretary/dispatch/assessment_decision.py",
    "src/secretary/dispatch/claim.py",
    "src/secretary/dispatch/gate_lifecycle.py",
    "src/secretary/dispatch/review_verdict.py",
    "src/secretary/dispatch/release_lifecycle.py",
    "src/secretary/dispatch/worker_launch.py",
    "src/secretary/dispatch/worker_report.py",
    "src/secretary/dispatch/worker_continuation.py",
    "src/secretary/dispatch/wait_vitality.py",
    "src/secretary/routing_journal.py",
    "src/secretary/dispatch/state.py",
    "src/secretary/dispatch/pause.py",
    "src/secretary/po/models.py",
    "src/secretary/runtime/__init__.py",
    "src/secretary/runtime/paths.py",
    "src/secretary/runtime/references.py",
    "src/secretary/runtime/prompt_document.py",
    "src/secretary/runtime/launch_prefix.py",
    "src/secretary/runtime/shared_state.py",
    "src/secretary/runtime/claude_sessions.py",
    "src/secretary/runtime/claude_env.py",
]
follow_imports = "silent"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["src/secretary", "src/triggered_agents"]

[project]
name = "secretary"
version = "0.1.0"
description = "Portable secretary appliance CLI skeleton."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0",
    # 4.18 is the first release whose validators take a `referencing` registry (its own
    # dependency from then on): secretary/config.py resolves one bundled schema's `$ref` to
    # another through it.
    "jsonschema>=4.18",
    # The secret store is part of the product, not an extra: an installation that
    # cannot open its own secrets is not recoverable. 41.0 is the first release
    # with the AEAD and KDF surface secretary/secret_store.py uses.
    "cryptography>=41.0",
    # The board store's driver, core for the same reason: an installation that
    # cannot reach its board is not degraded, it is non-functional (docs/BOARD_STORE.md §5.8).
    # The `binary` extra ships manylinux wheels that bundle libpq, so no libpq-dev, no compiler
    # and no apt step. A floor, not an equality pin, like the three above; ruff is equality-pinned
    # because a linter's version is part of a gate's meaning and a driver's is not.
    "psycopg[binary]>=3.2",
    # The board store's schema is SQLAlchemy models and its migrations are Alembic's, by the
    # owner's decision of 2026-09-07 (docs/BOARD_STORE.md §7.4). Both are core for the same
    # reason the driver is: an installation that cannot build or verify its own
    # schema cannot serve the board at all. 2.0 is the first SQLAlchemy with the declarative
    # and `Identity`/`Computed` surface board/schema.py uses; 1.13 is the Alembic that speaks
    # it. Floors, not equality pins, like everything above except ruff.
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.4",
]
ci = [
    "coverage>=7.6",
]
typecheck = [
    "mypy==1.18.2",
]
memory = [
    "mcp==1.28.1",
    "fastembed==0.8.0",
    "sqlite-vec==0.1.9",
    "numpy==2.4.6",
]

[project.scripts]
secretary = "secretary.cli:main"
secretary-memory-mcp = "secretary.memory_service:main"
secretary-memory-po-bridge = "secretary.memory.po_bridge:main"
secretary-memory-reindex = "secretary.memory_reindex:main"
triggered-agents = "triggered_agents.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["secretary*", "triggered_agents*"]

[tool.setuptools.package-data]
"secretary.schemas" = ["*.json"]
# Alembic reads its environment, template and revisions from the installed tree by path, so
# they ship with the package rather than only existing in the checkout.
"secretary.board.migrations" = ["script.py.mako", "versions/*.py"]
"triggered_agents.agents.curator" = ["*.toml"]
"triggered_agents.agents.pipeline" = ["*.toml"]
"triggered_agents.agents.retro" = ["*.toml"]
"triggered_agents.agents.steward" = ["*.toml"]
