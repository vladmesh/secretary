# Dispatch-only probe for the required-checks gate (secretary-841): it posts a check-run named
# `optional-suite` that always fails, so a live run can show the gate ignoring a failed check that
# is not in the adapter's `validation.required_checks`. Never runs on push or pull_request, and
# does not touch the `ci` workflow's `test` job — the only required check.
name: optional-suite

on:
  workflow_dispatch:

jobs:
  optional-suite:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "deliberate failure: this check is optional and the gate must ignore it"
          exit 1
