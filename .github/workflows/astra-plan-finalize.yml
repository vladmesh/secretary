name: Astra plan finalize

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.head_ref == 'astra_audit' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Finalize audit plan
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('astra_audit.md')
          text = path.read_text(encoding='utf-8')
          old = (
              'Phase 2 is complete: A07–A11 now have typed domain boundaries while preserving the released '
              'compatibility/storage projections. The next cleanup tier starts with bounded A12 event-payload work '
              'rather than reopening Sprint migration.'
          )
          new = (
              'Phase 2 is complete: A07–A11 now have typed domain boundaries while preserving the released '
              'compatibility/storage projections. A12 has also completed its bounded payload/handoff migrations; '
              'the active cleanup tier is now durable dispatcher state under A13.'
          )
          if old not in text:
              raise SystemExit('stale Phase 2 anchor missing')
          text = text.replace(old, new, 1)

          forbidden = (
              '◐ **A12',
              'A12 is in progress:',
              '`OutcomeRoundContext` remains the clearest next',
              'outcome-round context remains',
          )
          stale = [token for token in forbidden if token in text]
          if stale:
              raise SystemExit(f'stale A12 plan text remains: {stale}')

          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/astra-plan-finalize.yml
      - name: Push final plan
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git add astra_audit.md .github/workflows/astra-plan-finalize.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs: finalize post-A12 execution order"
          git push origin "HEAD:${HEAD_BRANCH}"
