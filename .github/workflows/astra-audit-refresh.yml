name: Refresh Astra audit

on:
  push:
    branches: [astra_audit]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 scripts/astra_audit_refresh.py
      - run: rm scripts/astra_audit_refresh.py .github/workflows/astra-audit-refresh.yml
      - run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add -A
          git commit -m "docs: update Astra audit after A09 task slice"
          git push origin HEAD:astra_audit
