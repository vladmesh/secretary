name: Refresh Astra audit after PR 446

on:
  push:
    branches:
      - astra_audit

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra_audit
      - name: Update audit progress and remaining plan
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('astra_audit.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'expected audit text not found: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '- 🟡 **A09 partially completed in PR #442:** centralized the task-side Kanboard wire-format constants and pure normalizers in `secretary.board.legacy_codec`. `tasks.py`, restore, and the board importer now share the same parser objects, and restore\'s duplicate `_enum_or_default` is gone. The sprint-specific `_budget`, `_resume`, `_source_audit`, and `_json_list` imports remain as the deliberate A09 tail and should move together with the sprint-model work rather than through a riskier mechanical extraction.\n',
              '- ✅ **A09 completed across PR #442 and PR #446:** #442 centralized the task-side Kanboard wire-format constants and pure normalizers in `secretary.board.legacy_codec`; #446 added the typed sprint-read compatibility boundary and moved `board/import_board.py` off the remaining private sprint helpers. Historical private aliases remain only as same-module/backward-compatibility adapters, not cross-feature dependencies.\n'
          )
          replace_once(
              '- ✅ **A10 completed in PR #441:** renamed the routing-journal domain value to canonical `RoutingHeadSnapshot`, kept the runtime lifecycle value as `HeadRun`, and added a typed launch boundary without changing routing-event JSON or persisted dispatcher state. Historical routing names and the dict adapter remain compatibility surfaces until the adjacent package/state migrations remove them.\n',
              '- ✅ **A10 completed in PR #441:** renamed the routing-journal domain value to canonical `RoutingHeadSnapshot`, kept the runtime lifecycle value as `HeadRun`, and added a typed launch boundary without changing routing-event JSON or persisted dispatcher state. Historical routing names and the dict adapter remain compatibility surfaces until the adjacent package/state migrations remove them.\n- 🟡 **A11 partially completed in PR #446:** added `secretary.board.sprint_read` with immutable typed Sprint state/budget/resume/source-audit/read-metadata values; `SprintReader` now parses those compound legacy fields once and renders the released dict document only at its public boundary, and Sprint status sets derive from `SprintState`. The remaining A11 work is guard-index/admission/write-path domain dictionaries plus the broader internal `SprintReader`/writer flow that still passes public dict-shaped sprint documents around.\n'
          )
          replace_once(
              '| A09 | 🟡 Stop importing private task/sprint normalizers across feature boundaries — **task-side completed in #442; sprint-side remains** | **3** |',
              '| A09 | ✅ Stop importing private task/sprint normalizers across feature boundaries — **completed across #442 and #446** | **3** |'
          )
          replace_once(
              '| A11 | Migrate legacy sprint dicts/status strings onto the normalized sprint model | **3** |',
              '| A11 | 🟡 Migrate legacy sprint dicts/status strings onto the normalized sprint model — **typed read boundary landed in #446; guard/admission/write-path dicts remain** | **3** |'
          )
          replace_once(
              '### A09. Stop cross-package imports of private normalizers — complexity 3 — partially completed',
              '### A09. Stop cross-package imports of private normalizers — complexity 3 — completed'
          )
          replace_once(
              '**Remaining A09 tail:** the importer still consumes sprint-specific `_budget`, `_resume`, `_source_audit`, and `_json_list` from `secretary.sprints`. Those helpers are coupled to the larger sprint read model, so move them only when A11 introduces the typed sprint compatibility boundary (or into a dedicated sprint legacy codec as part of that work), preserving the exact old wire semantics.\n\nAfter Kanboard retirement, the compatibility codec can be removed together with the importer/cutover path.',
              '**Completed in PR #446 (sprint-side tail):** added `secretary.board.sprint_read` as the explicit typed compatibility boundary for Sprint state, budget, resume, source-audit, and legacy JSON-list metadata. `board/import_board.py` now consumes that boundary instead of importing `_budget`, `_resume`, `_source_audit`, or `_json_list` from `secretary.sprints`. The old private helpers remain thin compatibility adapters for historical same-package/test callers, so the released wire semantics are unchanged while the cross-feature private dependency is gone.\n\nA09 is therefore complete. After Kanboard retirement, the remaining compatibility codecs/adapters can be removed together with the importer/cutover path under A18 rather than being treated as unfinished A09 work.'
          )
          replace_once(
              '### A11. Migrate legacy sprint dictionaries to the normalized sprint model — complexity 3',
              '### A11. Migrate legacy sprint dictionaries to the normalized sprint model — complexity 3 — partially completed'
          )
          replace_once(
              '**Fix:** introduce typed read models for the data not represented by the minimal `board.models.Sprint` yet (`SprintBudget`, `SprintResume`, `SprintReservationSet`, etc.) and make `SprintReader` return typed values internally. Keep dict rendering at the CLI/checkpoint boundary.\n\nThis can be done operation by operation without changing storage.',
              '**Implemented in PR #446 (first slice):** introduced `secretary.board.sprint_read` with immutable `SprintBudget`, `SprintResume`, `SprintSourceAudit`, and `SprintReadMetadata` values plus canonical `SprintState` parsing. `SprintReader` now converts the compound legacy metadata once through that boundary and projects the existing public dict shape afterwards. The string status set is derived from `SprintState`, and the same typed boundary is reused by the one-shot importer. Persisted metadata, SQL/Kanboard storage, CLI/web/checkpoint documents, and write semantics are unchanged.\n\n**Remaining A11 tail:** move the guard-index/admission/write-path closed shapes and the remaining internal sprint flow off `dict[str, Any]`. In particular, reservation sets/admission candidates, guard-index records, and writer inputs/results should become typed values before rendering back to the established public/storage dictionaries. Keep doing this operation by operation; do not combine it with a storage migration or Kanboard retirement.'
          )
          replace_once(
              'PR #434, PR #435, PR #436, PR #437, PR #438, PR #440, PR #441, PR #442, PR #443, PR #444, and PR #445 all passed their full pull-request CI workflow and were merged into `main`.',
              'PR #434, PR #435, PR #436, PR #437, PR #438, PR #440, PR #441, PR #442, PR #443, PR #444, PR #445, and PR #446 all passed their full pull-request CI workflow and were merged into `main`.'
          )
          replace_once(
              'PR #445 passed typecheck, all seven test shards, and the aggregate exact-SHA evidence/coverage gate on head SHA `840fc38266d118d570f357036d2406f81526ae3e` before squash-merge.',
              'PR #445 passed typecheck, all seven test shards, and the aggregate exact-SHA evidence/coverage gate on head SHA `840fc38266d118d570f357036d2406f81526ae3e` before squash-merge. PR #446 passed typecheck, all seven test shards, and the aggregate exact-SHA evidence/coverage gate on head SHA `5b26fbd8768963153f44cc42d6a70760b3d16f0b` before squash-merge.'
          )
          replace_once(
              '~~A07~~, A08, A09 (sprint-side remainder), ~~A10~~, A11.',
              '~~A07~~, ~~A08~~, ~~A09~~, ~~A10~~, A11.'
          )
          replace_once(
              'A10 is complete via PR #441. A07 is complete across PR #443 and PR #444: product board roles now have one canonical typed vocabulary from the normalized Actor through TaskWriter, CLI choices, transitions, and importer boundaries; the separate legacy runtime registry stays with A19. A09\'s task/restore/importer slice is complete via PR #442; its remaining sprint-side private-normalizer seam should be finished together with A11. The goal remains one typed vocabulary per concept and one parser at each legacy boundary.',
              'A10 is complete via PR #441. A07 is complete across PR #443 and PR #444: product board roles now have one canonical typed vocabulary from the normalized Actor through TaskWriter, CLI choices, transitions, and importer boundaries; the separate legacy runtime registry stays with A19. A08 is complete via PR #445. A09 is complete across PR #442 and PR #446: both task and sprint cross-feature private-normalizer imports are gone. PR #446 also landed the first A11 typed read-model slice; A11 now continues with guard/admission/write-path dictionaries. The goal remains one typed vocabulary per concept and one parser at each legacy boundary.'
          )
          replace_once(
              'With A01–A06, A10 and A16 complete and A07 partially landed, the highest-value near-term sequence is: **A07 tail/A08 → A09+A11 → A13**. A17/A19/A20 should be planned as explicit deprecation projects rather than mixed into ordinary refactors.',
              'With A01–A10 and A16 complete, and the first A11 slice landed, the highest-value near-term sequence is: **A11 tail → A12/A13**, keeping each migration bounded to one closed domain shape at a time. A17/A19/A20 should be planned as explicit deprecation projects rather than mixed into ordinary refactors.'
          )

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- astra_audit.md
      - name: Commit refreshed plan
        run: |
          if git diff --quiet -- astra_audit.md; then
            echo 'No audit update needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add astra_audit.md
          git commit -m 'docs: update Astra audit after PR 446'
          git push origin HEAD:astra_audit
