name: Refresh A11 audit progress

on:
  push:
    branches:
      - astra_audit

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, 'record merged A11 admission slice') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra_audit
          fetch-depth: 0
      - name: Update audit plan
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('astra_audit.md')
          text = path.read_text(encoding='utf-8')

          replacements = {
              "- 🟡 **A11 partially completed in PR #446:** added `secretary.board.sprint_read` with immutable typed Sprint state/budget/resume/source-audit/read-metadata values; `SprintReader` now parses those compound legacy fields once and renders the released dict document only at its public boundary, and Sprint status sets derive from `SprintState`. The remaining A11 work is guard-index/admission/write-path domain dictionaries plus the broader internal `SprintReader`/writer flow that still passes public dict-shaped sprint documents around.":
              "- 🟡 **A11 partially completed across PR #446 and PR #447:** #446 added the immutable typed Sprint read boundary; #447 added typed `SprintAdmission` and immutable `SprintReservationIndex` values, moved admission collision checks and the versioned local guard index onto those types, and preserved the existing storage/wire JSON projections. The remaining A11 work is the broader sprint write-path/internal flow that still passes public dict-shaped sprint documents around beyond the now-typed read/admission/index seams.",

              "PR #434, PR #435, PR #436, PR #437, PR #438, PR #440, PR #441, PR #442, PR #443, PR #444, PR #445, and PR #446 all passed their full pull-request CI workflow and were merged into `main`. PR #443 passed typecheck and all seven test shards on exact head SHA `6ddbfb3ea8ee5d49b68468f0f8a205533f69e11c`; PR #444 passed typecheck, all seven test shards, and the aggregate exact-SHA evidence/coverage gate on head SHA `1d92ab9533ec3b2abe66003303c34d82c46ba7eb`; PR #445 passed typecheck, all seven test shards, and the aggregate exact-SHA evidence/coverage gate on head SHA `840fc38266d118d570f357036d2406f81526ae3e` before squash-merge. PR #446 passed typecheck, all seven test shards, and the aggregate exact-SHA evidence/coverage gate on head SHA `5b26fbd8768963153f44cc42d6a70760b3d16f0b` before squash-merge.":
              "PR #434, PR #435, PR #436, PR #437, PR #438, PR #440, PR #441, PR #442, PR #443, PR #444, PR #445, PR #446, and PR #447 all passed their full pull-request CI workflow and were merged into `main`. PR #443 passed typecheck and all seven test shards on exact head SHA `6ddbfb3ea8ee5d49b68468f0f8a205533f69e11c`; PR #444 passed typecheck, all seven test shards, and the aggregate exact-SHA evidence/coverage gate on head SHA `1d92ab9533ec3b2abe66003303c34d82c46ba7eb`; PR #445 passed typecheck, all seven test shards, and the aggregate exact-SHA evidence/coverage gate on head SHA `840fc38266d118d570f357036d2406f81526ae3e` before squash-merge. PR #446 passed typecheck, all seven test shards, and the aggregate exact-SHA evidence/coverage gate on head SHA `5b26fbd8768963153f44cc42d6a70760b3d16f0b` before squash-merge. PR #447 passed typecheck, all seven test shards, and the aggregate exact-SHA evidence/coverage gate on head SHA `0018f63ec5a920094628593c302b99dab2a29fa0`, then squash-merged as `3215ce651402c2a300a09b497e4bffdc4cefb291`.",

              "| A11 | 🟡 Migrate legacy sprint dicts/status strings onto the normalized sprint model — **typed read boundary landed in #446; guard/admission/write-path dicts remain** | **3** |":
              "| A11 | 🟡 Migrate legacy sprint dicts/status strings onto the normalized sprint model — **typed read boundary landed in #446; typed admission/guard-index slice landed in #447; broader write-path/internal dict flow remains** | **3** |",

              "**Remaining A11 tail:** move the guard-index/admission/write-path closed shapes and the remaining internal sprint flow off `dict[str, Any]`. In particular, reservation sets/admission candidates, guard-index records, and writer inputs/results should become typed values before rendering back to the established public/storage dictionaries. Keep doing this operation by operation; do not combine it with a storage migration or Kanboard retirement.":
              "**Implemented in PR #447 (second slice):** added immutable `SprintAdmission` and `SprintReservationIndex` domain values. Admission candidates/open-sprint collision checks now cross a typed boundary instead of passing raw sprint dictionaries into the conflict helpers; the local version-2 guard index is parsed, updated, and rendered through the typed index while keeping its on-disk JSON version and shape unchanged. Existing public/storage sprint dictionaries remain compatibility projections. The new admission module is included in the incremental mypy gate, focused admission/index tests were added, and the new test file is registered in the fail-closed CI shard manifest. Full PR CI passed on exact head SHA `0018f63ec5a920094628593c302b99dab2a29fa0`; the PR squash-merged as `3215ce651402c2a300a09b497e4bffdc4cefb291`.\n\n**Remaining A11 tail:** move the broader sprint write-path/internal flow off `dict[str, Any]` where closed sprint documents still travel between writer/read helpers. Writer inputs/results and internal sprint documents should become typed values before rendering back to the established public/storage dictionaries. The guard-index and admission-candidate subproblem is now complete; keep the remaining work operation-by-operation and do not combine it with a storage migration or Kanboard retirement.",

              "A10 is complete via PR #441. A07 is complete across PR #443 and PR #444: product board roles now have one canonical typed vocabulary from the normalized Actor through TaskWriter, CLI choices, transitions, and importer boundaries; the separate legacy runtime registry stays with A19. A08 is complete via PR #445. A09 is complete across PR #442 and PR #446: both task and sprint cross-feature private-normalizer imports are gone. PR #446 also landed the first A11 typed read-model slice; A11 now continues with guard/admission/write-path dictionaries. The goal remains one typed vocabulary per concept and one parser at each legacy boundary.":
              "A10 is complete via PR #441. A07 is complete across PR #443 and PR #444: product board roles now have one canonical typed vocabulary from the normalized Actor through TaskWriter, CLI choices, transitions, and importer boundaries; the separate legacy runtime registry stays with A19. A08 is complete via PR #445. A09 is complete across PR #442 and PR #446: both task and sprint cross-feature private-normalizer imports are gone. PR #446 landed the first A11 typed read-model slice, and PR #447 completed the bounded admission/reservation/guard-index slice. A11 now continues only with the broader write-path/internal sprint-document flow. The goal remains one typed vocabulary per concept and one parser at each legacy boundary.",

              "With A01–A10 and A16 complete, and the first A11 slice landed, the highest-value near-term sequence is: **A11 tail → A12/A13**, keeping each migration bounded to one closed domain shape at a time. A17/A19/A20 should be planned as explicit deprecation projects rather than mixed into ordinary refactors.":
              "With A01–A10 and A16 complete, and the A11 read plus admission/guard-index slices landed, the highest-value near-term sequence is: **finish the remaining A11 write-path/internal-flow tail → A12/A13**, keeping each migration bounded to one closed domain shape at a time. A17/A19/A20 should be planned as explicit deprecation projects rather than mixed into ordinary refactors."
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'expected exactly one audit anchor, found {count}: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit plan update and remove bootstrap workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/a11_plan_refresh.yml
          git add astra_audit.md
          git diff --check
          git commit -m 'docs: record merged A11 admission slice'
          git push origin HEAD:astra_audit
