name: update-a08-audit

on:
  push:
    branches: [astra_audit]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra_audit
          fetch-depth: 0
      - name: Update audit
        run: python3 scripts/update_a08_audit.py
      - name: Remove one-shot updater
        run: git rm scripts/update_a08_audit.py .github/workflows/update-a08-audit.yml
      - name: Commit audit progress
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add astra_audit.md
          git commit -m 'docs: mark A08 task routing complete'
          git push origin HEAD:astra_audit
