name: astra-a11-write-flow-patch

on:
  push:
    branches: [astra-a11-sprint-write-flow]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply A11 sprint write-flow refactor') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-a11-sprint-write-flow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded refactor
        run: python3 scripts/_astra_a11_patch.py
      - name: Remove patch scaffolding
        run: rm scripts/_astra_a11_patch.py .github/workflows/_astra_a11_patch.yml
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install -e '.[dev,typecheck,ci]'
      - name: Format and lint changed Python
        run: |
          python3 -m ruff check --fix src/secretary/board/sprint_write.py src/secretary/sprints.py tests/test_sprint_write.py
          python3 -m ruff format src/secretary/board/sprint_write.py src/secretary/sprints.py tests/test_sprint_write.py
          python3 -m ruff check src/secretary/board/sprint_write.py src/secretary/sprints.py tests/test_sprint_write.py
      - name: Typecheck typed leaves
        run: python3 -m mypy
      - name: Focused Sprint tests
        run: >-
          python3 -m unittest
          tests.test_sprint_write
          tests.test_sprint_read
          tests.test_sprint_admission
          tests.test_sprints
          tests.test_sprint_restore
          tests.test_sprint_executors
      - name: Commit final tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'refactor: type sprint write flow'
          git push origin HEAD:astra-a11-sprint-write-flow
