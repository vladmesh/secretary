name: A09-A11 minimize importer diff

on:
  push:
    branches:
      - astra-a09-a11-sprint-read-model

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-a09-a11-sprint-read-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore unchanged importer formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          path = Path('src/secretary/board/import_board.py')
          current = path.read_text(encoding='utf-8')
          original = subprocess.check_output(
              ['git', 'show', 'origin/main:src/secretary/board/import_board.py'], text=True
          )
          marker = 'PIPELINE_BOARD_NAME = "Pipeline"\n'
          current_prefix, _ = current.split(marker, 1)
          _, original_body = original.split(marker, 1)
          body = original_body
          replacements = {
              r'(?<![A-Za-z0-9_])_budget\(': 'sprint_budget_document(',
              r'(?<![A-Za-z0-9_])_json_list\(': 'sprint_string_list(',
              r'(?<![A-Za-z0-9_])_resume\(': 'sprint_resume_document(',
              r'(?<![A-Za-z0-9_])_source_audit\(': 'sprint_source_audit_document(',
              r'\bSPRINT_STATUSES\b': 'SPRINT_STATE_VALUES',
          }
          for pattern, replacement in replacements.items():
              body = re.sub(pattern, replacement, body)
          path.write_text(current_prefix + marker + body, encoding='utf-8')
          PY
      - name: Check minimized importer
        run: |
          python3 -m pip install --disable-pip-version-check -q ruff==0.16.4
          python3 -m ruff check src/secretary/board/import_board.py
          python3 -m py_compile src/secretary/board/import_board.py
          git diff --check
      - name: Remove cleanup workflow and commit
        run: |
          git rm .github/workflows/a11-minimize-import-diff.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: minimize sprint importer diff'
          git push origin HEAD:astra-a09-a11-sprint-read-model
