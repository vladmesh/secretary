name: astra-a07-normalize-worker

on:
  push:
    branches:
      - astra-a07-role-boundaries

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: astra-a07-role-boundaries
      - name: Normalize remaining TaskWriter role boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("src/secretary/tasks.py")
          text = path.read_text(encoding="utf-8")
          old = "from collections.abc import Callable, Iterable, Iterator\n"
          new = "from collections.abc import Callable, Collection, Iterable, Iterator\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected collections import")
          text = text.replace(old, new, 1)

          old = "    def _role(role: Role | str, allowed: frozenset[Role]) -> Role:\n"
          new = "    def _role(role: Role | str, allowed: Collection[Role]) -> Role:\n"
          if text.count(old) != 1:
              raise SystemExit("unexpected _role signature")
          text = text.replace(old, new, 1)

          members = {
              "po": "PO",
              "dispatcher": "DISPATCHER",
              "worker": "WORKER",
              "reviewer": "REVIEWER",
              "observer": "OBSERVER",
              "steward": "STEWARD",
              "retro": "RETRO",
          }
          singleton = re.compile(
              r'(?m)^(?P<indent>\s*)self\._role\(role, \{"(?P<role>po|dispatcher|worker|reviewer|observer|steward|retro)"\}\)$'
          )

          def typed_singleton(match: re.Match[str]) -> str:
              role = match.group("role")
              return (
                  f'{match.group("indent")}role = self._role('
                  f'role, {{Role.{members[role]}}})'
              )

          text, converted = singleton.subn(typed_singleton, text)
          if converted < 5:
              raise SystemExit(f"expected several singleton role boundaries, found {converted}")

          unassigned = re.compile(r"(?m)^(?P<indent>\s*)self\._role\(role, (?P<allowed>[^\n]+)\)$")
          text, assigned = unassigned.subn(
              lambda m: f'{m.group("indent")}role = self._role(role, {m.group("allowed")})',
              text,
          )
          if re.search(r"(?m)^\s*self\._role\(role, ", text):
              raise SystemExit("an unnormalized role boundary remains")
          if re.search(r'self\._role\(role, \{"', text):
              raise SystemExit("a string singleton role vocabulary remains")

          path.write_text(text, encoding="utf-8")
          print(f"converted={converted} additionally_assigned={assigned}")
          PY

          python3 -m compileall -q src/secretary/tasks.py
          git diff --check
          rm -f .github/workflows/astra-a07-normalize-worker.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: normalize TaskWriter role boundaries"
          git push origin HEAD:astra-a07-role-boundaries
