# Synthetic e2e workflow for the sprint:1469 live proof of the e2e stage (DoD 4).
#
# It does no real testing: dispatched on a ref, it checks that ref out, prints the SHA and the
# `candidate` input, sleeps `minutes` minutes in one-minute steps, and then concludes `success` or
# `failure` as the `outcome` input asks. It runs only on workflow_dispatch, so ordinary CI never
# starts it. Removing it is safe once no adapter declares it in `validation.e2e`.
name: e2e-synthetic
run-name: E2E synthetic ${{ inputs.outcome }} ${{ inputs.minutes }}m

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How many minutes to run (an integer from 1 to 110)
        type: string
        default: "61"
      outcome:
        description: The conclusion the run ends in
        type: choice
        options: [success, failure]
        default: success
      candidate:
        description: The candidate SHA, echoed for the record
        type: string
        required: false
        default: ""

jobs:
  synthetic:
    name: synthetic e2e
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      MINUTES: ${{ inputs.minutes }}
      OUTCOME: ${{ inputs.outcome }}
      CANDIDATE: ${{ inputs.candidate }}
    steps:
      - name: Validate the inputs
        run: |
          if ! [[ "$MINUTES" =~ ^[0-9]{1,3}$ ]] || (( 10#$MINUTES < 1 || 10#$MINUTES > 110 )); then
            echo "::error::minutes must be an integer from 1 to 110, got '$MINUTES'"
            exit 1
          fi
          if [[ "$OUTCOME" != success && "$OUTCOME" != failure ]]; then
            echo "::error::outcome must be success or failure, got '$OUTCOME'"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Print the checked-out SHA and the candidate
        run: |
          echo "HEAD: $(git rev-parse HEAD)"
          echo "candidate: ${CANDIDATE:-<none>}"
      - name: Sleep in one-minute steps
        run: |
          total=$((10#$MINUTES))
          for ((minute = 1; minute <= total; minute++)); do
            sleep 60
            echo "minute $minute of $total"
          done
      - name: Conclude
        run: |
          echo "outcome: $OUTCOME"
          if [[ "$OUTCOME" == success ]]; then
            exit 0
          fi
          exit 1
