name: astra-audit-a07-update

on:
  push:
    branches:
      - astra_audit

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: astra_audit
      - name: Update A07 audit status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("astra_audit.md")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              '- 🟡 **A07 partially completed in PR #443:** introduced canonical product-side `Role(StrEnum)` plus typed create/proposal-create/edit role subsets, made `CARD_TRANSITIONS` use `Role` keys while preserving string-compatible callers, exported `Role` from `secretary.board`, added the role and transition leaves to the incremental mypy gate, and added a ratchet proving the legacy `tasks.py` role sets still match the canonical product vocabulary. `Actor.role`, task/CLI boundaries, and the legacy runtime role registry remain as the deliberate A07 tail; `triggered_agents.runtime.role_env` should move only with the A19 namespace migration rather than gaining a new back-import into product code.\n',
              '- ✅ **A07 completed across PR #443 and PR #444:** #443 introduced the canonical product-side `Role(StrEnum)`, typed role subsets, and `Role`-keyed card transitions; #444 made `Actor.role` carry `Role`, normalized TaskWriter role strings at the boundary, removed the duplicate task-side role registries, derived CLI/importer role choices from the canonical vocabulary, and replaced the temporary drift ratchet with boundary tests. Persisted/event/CLI spellings remain string-compatible. The separate `triggered_agents.runtime.role_env` registry remains intentionally owned by the later A19 namespace migration rather than by A07.\n',
              "progress A07",
          )

          replace_once(
              'PR #434, PR #435, PR #436, PR #437, PR #438, PR #440, PR #441, PR #442, and PR #443 all passed their full pull-request CI workflow and were merged into `main`. PR #443 passed typecheck and all seven test shards on exact head SHA `6ddbfb3ea8ee5d49b68468f0f8a205533f69e11c` before merge.\n',
              'PR #434, PR #435, PR #436, PR #437, PR #438, PR #440, PR #441, PR #442, PR #443, and PR #444 all passed their full pull-request CI workflow and were merged into `main`. PR #443 passed typecheck and all seven test shards on exact head SHA `6ddbfb3ea8ee5d49b68468f0f8a205533f69e11c`; PR #444 passed typecheck, all seven test shards, and the aggregate exact-SHA evidence/coverage gate on head SHA `1d92ab9533ec3b2abe66003303c34d82c46ba7eb` before squash-merge.\n',
              "merged PR summary",
          )

          replace_once(
              '| A07 | 🟡 Centralize the role vocabulary in one `Role(StrEnum)` — **product-side vocabulary/transition slice completed in #443; domain/CLI/runtime tail remains** | **3** |\n',
              '| A07 | ✅ Centralize the product role vocabulary in one `Role(StrEnum)` — **completed across #443 and #444; legacy runtime registry belongs to A19** | **3** |\n',
              "finding A07",
          )

          replace_once(
              '### A07. Centralize roles in one `Role(StrEnum)` — complexity 3 — partially completed\n',
              '### A07. Centralize roles in one `Role(StrEnum)` — complexity 3 — completed\n',
              "A07 heading",
          )

          replace_once(
              '**Remaining A07 tail:** make `board.models.Actor.role` carry `Role`, then migrate the task/sprint/CLI call sites to parse strings at their boundaries and remove the duplicated product-side sets rather than merely ratcheting them. `triggered_agents.runtime.role_env.BOARD_ROLES` deliberately remains separate for now: `triggered_agents` is a legacy namespace with a dependency-direction test preventing new imports back into `secretary`. That runtime registry should be migrated when A19 moves role/runtime ownership into the product package, not by introducing a new legacy-to-product back edge.\n',
              '**Completed in PR #444 (boundary/removal slice):** `board.models.Actor.role` now carries `Role` while accepting the released string spellings at construction boundaries. `TaskWriter` normalizes raw role strings once and uses the canonical board/create/comment/edit/proposal subsets; the duplicated task-local `_ROLES`, `_COMMENT_ROLES`, `_CREATE_ROLES`, `_PROPOSAL_CREATE_ROLES`, and `_EDIT_ROLES` registries are gone. `task_commands.py` derives argparse role choices from the canonical enum/subsets, and the board importer derives its marker-role strings from the same vocabulary instead of importing a private task constant. The temporary compatibility ratchet from #443 was replaced with tests for Actor normalization, writer authorization, CLI projection, and the absence of the duplicate registries.\n\n`triggered_agents.runtime.role_env.BOARD_ROLES` deliberately remains separate: `triggered_agents` is a legacy namespace with a dependency-direction test preventing new imports back into `secretary`. Moving that runtime-owned registry is part of A19, when role/runtime ownership itself leaves the legacy namespace; it is no longer an A07 tail.\n',
              "A07 tail",
          )

          replace_once(
              'A07 (remaining tail), A08, A09 (sprint-side remainder), ~~A10~~, A11.\n\nA10 is complete via PR #441. A07\'s product-side vocabulary/transition slice is complete via PR #443; its remaining work is to type `Actor.role`, move product task/CLI boundaries onto the enum, remove the compatibility role sets, and leave the legacy runtime registry for A19. A09\'s task/restore/importer slice is complete via PR #442; its remaining sprint-side private-normalizer seam should be finished together with A11. The goal remains one typed vocabulary per concept and one parser at each legacy boundary.\n',
              '~~A07~~, A08, A09 (sprint-side remainder), ~~A10~~, A11.\n\nA10 is complete via PR #441. A07 is complete across PR #443 and PR #444: product board roles now have one canonical typed vocabulary from the normalized Actor through TaskWriter, CLI choices, transitions, and importer boundaries; the separate legacy runtime registry stays with A19. A09\'s task/restore/importer slice is complete via PR #442; its remaining sprint-side private-normalizer seam should be finished together with A11. The goal remains one typed vocabulary per concept and one parser at each legacy boundary.\n',
              "phase 2",
          )

          path.write_text(text, encoding="utf-8")
          PY

          git diff --check
          rm -f .github/workflows/astra-audit-a07-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: mark Astra A07 complete"
          git push origin HEAD:astra_audit
