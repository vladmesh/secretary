name: worker-report-refactor

on:
  push:
    branches: [refactor/worker-report-lifecycle]
    paths: [.github/workflows/worker-report-refactor.yml]

permissions:
  contents: write

jobs:
  prepare:
    if: github.ref == 'refs/heads/refactor/worker-report-lifecycle'
    runs-on: ubuntu-latest
    env:
      TA_SECRETARY_REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/worker-report-lifecycle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned development checks
        run: python3 -m pip install -e '.[dev,typecheck]'
      - name: Apply the reviewed extraction and test wiring
        run: |
          python3 - <<'PY'
          import ast
          import re
          import subprocess
          from pathlib import Path
          import yaml

          # Reuse the exact extraction already inspected locally; this pinned, temporary recipe
          # is ours, not content from a remote branch discovered at execution time.
          recipe = subprocess.check_output([
              'git', 'show', '251b86b52b768b02b632d28d24a4354d7d58ba82:.github/workflows/worker-report-refactor.yml'
          ], text=True)
          workflow = yaml.safe_load(recipe)
          script = next(step['run'] for step in workflow['jobs']['prepare']['steps']
                        if step.get('name') == 'Extract the bounded report lifecycle')
          script = script.split("python3 - <<'PY'\n", 1)[1].rsplit('\nPY', 1)[0]
          exec(compile(script, '<reviewed-worker-report-extraction>', 'exec'))

          path = Path('src/secretary/dispatcher.py')
          text = path.read_text()
          text = re.sub(r'(_prompt_worker_report)\(self, *\n(\s*)task,', r'\1(\n\2self,\n\2task,', text)
          for name in ('infra_report_fields', 'render_infra_completion_record', '_round_blocked_report_classification', '_round_done_report_body'):
              if len(re.findall(r'\b' + name + r'\b', text)) == 1:
                  text = text.replace('    ' + name + ',\n', '')
          path.write_text(text)
          path = Path('src/secretary/dispatch/worker_report.py')
          text = path.read_text().replace('VitalityVerdict as VitalityVerdict', 'VitalityVerdict')
          path.write_text('\n'.join(line.rstrip() for line in text.splitlines()) + '\n')
          path = Path('tests/test_dispatcher.py')
          text = path.read_text()
          anchor = 'from secretary.dispatch import worker_launch as dispatcher_worker_launch\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, anchor + 'from secretary.dispatch import worker_report as dispatcher_worker_report\n', 1)
          anchor = '        blocked = self.runtime._block_repeated_infrastructure_done(\n'
          assert text.count(anchor) == 1
          text = text.replace(anchor, '        blocked = dispatcher_worker_report._block_repeated_infrastructure_done(\n            self.runtime,\n', 1)
          path.write_text(text)
          path = Path('tests/ci-shards.txt')
          text = path.read_text()
          anchor = 'integration-board tests/test_dispatcher_contracts.py\n'
          assert text.count(anchor) == 1
          path.write_text(text.replace(anchor, anchor + 'unit tests/test_dispatcher_worker_report.py\n', 1))
          path = Path('tests/test_architecture.py')
          text = path.read_text()
          anchor = '        self.assertNotIn("verify_worker_result(", advance_source)\n'
          assert text.count(anchor) == 1
          extra = '''        self.assertLess(
                      advance_source.index("_worker_report_marker("),
                      advance_source.index("if continuation.delivery_pending:"),
                  )
                  self.assertLess(
                      advance_source.index("if continuation.delivery_confirmed:"),
                      advance_source.index("_handle_worker_report("),
                  )
                  self.assertLess(
                      advance_source.index("_handle_worker_report("),
                      advance_source.index("self._wait_watchdog("),
                  )
          '''
          path.write_text(text.replace(anchor, anchor + extra, 1))
          path = Path('docs/HEAD_VITALITY.md')
          text = path.read_text().replace('`_prompt_worker_report`', '`dispatch.worker_report.prompt_worker_report`')
          path.write_text(text)
          for filename in ('src/secretary/dispatcher.py', 'src/secretary/dispatch/worker_report.py',
                           'tests/test_dispatcher.py', 'tests/test_architecture.py',
                           'tests/test_dispatcher_contracts.py', 'tests/test_dispatcher_worker_report.py'):
              ast.parse(Path(filename).read_text(), filename=filename)
          PY
      - name: Format and lint the new boundary
        run: |
          python3 -m ruff check --select I001 --fix src/secretary/dispatch/worker_report.py tests/test_dispatcher_worker_report.py
          python3 -m ruff format src/secretary/dispatch/worker_report.py tests/test_dispatcher_worker_report.py
          python3 -m ruff check src/secretary/dispatch/worker_report.py tests/test_dispatcher_worker_report.py
          git diff --check
      - name: Publish only the refactor files to its branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/secretary/dispatcher.py src/secretary/dispatch/worker_report.py pyproject.toml tests/test_architecture.py tests/test_dispatcher_contracts.py tests/test_dispatcher.py tests/test_dispatcher_worker_report.py tests/ci-shards.txt docs/HEAD_VITALITY.md
          git diff --cached --stat
          git commit -m 'refactor: extract worker report lifecycle into dispatch package'
          git push origin HEAD:refactor/worker-report-lifecycle
      - name: Typecheck
        run: python3 -m mypy
      - name: Focused dispatcher regressions
        run: python3 -m unittest tests.test_architecture tests.test_dispatcher_worker_report tests.test_dispatcher_contracts tests.test_dispatcher tests.test_attempt_outcome
      - name: Export the reviewed checkout
        if: always()
        run: git archive --format=tar HEAD > "$RUNNER_TEMP/worker-report-repo.tar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-report-checkout
          path: ${{ runner.temp }}/worker-report-repo.tar
          retention-days: 2
