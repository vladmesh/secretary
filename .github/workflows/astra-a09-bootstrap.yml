name: Astra A09 bootstrap

on:
  push:
    branches:
      - astra-a09-legacy-codec

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply mechanical refactor
        run: python scripts/astra_a09_patch.py
      - name: Syntax check changed Python
        run: python -m compileall -q src/secretary/board/legacy_codec.py src/secretary/tasks.py src/secretary/restore.py src/secretary/board/import_board.py tests/test_tasks.py
      - name: Remove bootstrap machinery
        run: rm scripts/astra_a09_patch.py .github/workflows/astra-a09-bootstrap.yml
      - name: Commit refactor
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: centralize legacy task normalization'
          git push origin HEAD:astra-a09-legacy-codec
