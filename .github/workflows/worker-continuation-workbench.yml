name: worker-continuation-workbench

on:
  push:
    branches: [work/worker-continuation-extraction]

permissions:
  contents: write

jobs:
  workbench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make existing gate reset explicit at typed boundary
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/secretary/dispatch/worker_continuation.py')
          text = p.read_text()
          text = text.replace('from secretary.dispatch.state import DispatcherRecord, now_rfc3339', 'from secretary.dispatch.state import DispatcherRecord, PersistedGateReceipt, now_rfc3339')
          text = text.replace('record.gate_attestation = {}', 'record.gate_attestation = PersistedGateReceipt()')
          p.write_text(text)
          p = Path('tests/test_dispatcher_worker_continuation.py')
          text = p.read_text().replace('from secretary.dispatch.state import DispatcherRecord\n', 'from secretary.dispatch.state import DispatcherRecord, PersistedGateReceipt\n')
          text = text.replace('    def test_red_move_replay_keeps_its_request_and_reserved_generation(self) -> None:\n        snapshots = []', '    def test_red_move_replay_keeps_its_request_and_reserved_generation(self) -> None:\n        self.record.gate_attestation = PersistedGateReceipt({"previous_round": "receipt"})\n        snapshots = []')
          text = text.replace('        first_request = self.runtime.terminal_effect.call_args.kwargs["request_id"]', '        self.assertIsInstance(self.record.gate_attestation, PersistedGateReceipt)\n        self.assertEqual(self.record.gate_attestation.to_json(), {})\n        first_request = self.runtime.terminal_effect.call_args.kwargs["request_id"]')
          p.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/secretary/dispatch/worker_continuation.py tests/test_dispatcher_worker_continuation.py
          if ! git diff --cached --quiet; then
            git commit -m "refactor: use canonical empty gate receipt in continuation reset"
            git push origin HEAD:work/worker-continuation-extraction
          fi
      - name: Archive tracked candidate without Git credentials
        if: always()
        run: git archive --format=tar.gz --output="$RUNNER_TEMP/continuation-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: continuation-source-${{ github.sha }}
          path: ${{ runner.temp }}/continuation-source.tar.gz
          retention-days: 3
      - name: Install development checks
        run: python3 -m pip install -e '.[memory,ci,typecheck,dev]'
      - name: Lint changed Python
        run: python3 -m ruff check src/secretary/dispatcher.py src/secretary/dispatch/worker_continuation.py tests/test_dispatcher_worker_continuation.py tests/test_architecture.py tests/test_dispatcher.py tests/test_dispatcher_contracts.py tests/test_dispatcher_launch_intent.py
      - name: Check incremental types
        run: python3 -m mypy
      - name: Check extracted boundary
        if: always()
        env:
          TA_SECRETARY_REPO: ${{ github.workspace }}
        run: python3 -m unittest tests.test_dispatcher_worker_continuation tests.test_dispatcher_worker_report tests.test_architecture tests.test_dispatcher_contracts.HostSurfaceContractTests
