name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test_shards:
    name: test / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [core, dispatcher, runtime, component]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install -e '.[memory]'
      - run: python3 scripts/ci_test_shards.py --shard "${{ matrix.shard }}"

  test:
    name: test
    if: ${{ always() }}
    needs: test_shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every test shard
        env:
          SHARDS_RESULT: ${{ needs.test_shards.result }}
        run: test "$SHARDS_RESULT" = success
