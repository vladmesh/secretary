name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test_suites:
    name: test / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, component, runtime-component, integration-recovery, integration-memory, integration-board, packaging]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install -e '.[memory]'
      - name: Run reported suite
        id: run_suite
        continue-on-error: true
        run: >-
          python3 scripts/ci_test_shards.py --suite "${{ matrix.suite }}"
          --report-dir "$RUNNER_TEMP/ci-evidence/${{ matrix.suite }}"
          --candidate-sha "$GITHUB_SHA"
      - name: Write suite evidence summary
        if: ${{ always() }}
        continue-on-error: true
        run: >-
          python3 scripts/ci_test_shards.py --summary
          --report-dir "$RUNNER_TEMP/ci-evidence/${{ matrix.suite }}"
          >> "$GITHUB_STEP_SUMMARY"
      - name: Upload suite JUnit and bounded log
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ci-evidence-${{ matrix.suite }}-${{ github.sha }}
          path: ${{ runner.temp }}/ci-evidence/${{ matrix.suite }}
          if-no-files-found: error
          retention-days: 14
      - name: Preserve suite result
        if: ${{ always() }}
        run: >-
          python3 scripts/ci_test_shards.py --summary
          --report-dir "$RUNNER_TEMP/ci-evidence/${{ matrix.suite }}"
          > /dev/null

  test:
    name: test
    if: ${{ always() }}
    needs: test_suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download suite evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: ci-evidence-*
          path: ${{ runner.temp }}/ci-evidence
          merge-multiple: false
      - name: Require and classify every test suite
        env:
          SUITES_RESULT: ${{ needs.test_suites.result }}
        run: >-
          python3 scripts/ci_test_shards.py --aggregate
          --evidence-dir "$RUNNER_TEMP/ci-evidence"
          --needs-result "$SUITES_RESULT"
          >> "$GITHUB_STEP_SUMMARY"
