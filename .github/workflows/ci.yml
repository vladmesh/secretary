name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test_suites:
    name: test / ${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, component, runtime-component, integration-recovery, integration-memory, integration-board, packaging]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install -e '.[memory]'
      - run: python3 scripts/ci_test_shards.py --suite "${{ matrix.suite }}"

  test:
    name: test
    if: ${{ always() }}
    needs: test_suites
    runs-on: ubuntu-latest
    steps:
      - name: Require every test suite
        env:
          SUITES_RESULT: ${{ needs.test_suites.result }}
        run: test "$SUITES_RESULT" = success
