name: a08-minimize

on:
  push:
    branches: [refactor/a08-task-routing]

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/a08-task-routing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Minimize legacy-file diff
        run: python3 scripts/a08_minimize.py
      - name: Install checks
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[dev,typecheck]'
      - name: Normalize A08 leaves
        run: |
          python3 -m ruff check --fix \
            src/secretary/board/task_routing.py \
            src/secretary/board/legacy_codec.py \
            src/secretary/board/__init__.py \
            tests/test_task_routing.py
      - name: Check A08
        run: |
          python3 -m mypy
          python3 -m ruff check \
            src/secretary/board/task_routing.py \
            src/secretary/board/legacy_codec.py \
            src/secretary/board/__init__.py \
            tests/test_task_routing.py
          python3 -m ruff format --check \
            src/secretary/board/task_routing.py \
            src/secretary/board/legacy_codec.py \
            src/secretary/board/__init__.py \
            tests/test_task_routing.py
          python3 -m unittest \
            tests.test_task_routing \
            tests.test_task_commands \
            tests.test_tasks \
            tests.test_board_import_mapping
          git diff --check
      - name: Commit minimized A08
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'refactor: minimize A08 diff [a08-minimize]'
          git push origin HEAD:refactor/a08-task-routing
