name: A11 sprint budget parity fix

on:
  push:
    branches:
      - astra-a09-a11-sprint-read-model

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: astra-a09-a11-sprint-read-model
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve empty-threshold legacy semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          module = Path('src/secretary/board/sprint_read.py')
          text = module.read_text(encoding='utf-8')
          old = '        limits = dict(thresholds) if thresholds is not None else budget_thresholds()\n'
          new = '        limits = dict(thresholds) if thresholds else budget_thresholds()\n'
          if text.count(old) != 1:
              raise SystemExit('expected SprintBudget thresholds line exactly once')
          module.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/test_sprint_read.py')
          text = test.read_text(encoding='utf-8')
          marker = '    def test_required_resume_reports_the_same_missing_field_contract(self) -> None:\n'
          addition = '''    def test_empty_budget_threshold_override_keeps_legacy_defaults(self) -> None:\n        read = SprintReadMetadata.from_legacy({}, thresholds={})\n\n        self.assertEqual(read.budget.thresholds, {"signal": 3, "hard": 6})\n        self.assertFalse(read.budget.signal_reached)\n        self.assertFalse(read.budget.hard_reached)\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('expected resume test marker exactly once')
          test.write_text(text.replace(marker, addition + marker), encoding='utf-8')
          PY
      - name: Focused checks
        env:
          PYTHONPATH: src
        run: |
          python3 -m pip install --disable-pip-version-check -q ruff==0.16.4 mypy==1.18.2
          python3 -m ruff check src/secretary/board/sprint_read.py tests/test_sprint_read.py
          python3 tests/test_sprint_read.py
          python3 -m mypy --python-version 3.12 src/secretary/board/sprint_read.py
          git diff --check
      - name: Remove workflow and commit
        run: |
          git rm .github/workflows/a11-budget-parity.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: preserve sprint budget threshold fallback'
          git push origin HEAD:astra-a09-a11-sprint-read-model
