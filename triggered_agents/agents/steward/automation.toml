# Portable automation spec for the steward triggered-agent.
#
# Canon for HOW the steward is scheduled and dispatched. Host bindings Orca generates (workspace
# path, repo/automation UUIDs) are NOT here — `secretary upgrade` resolves them on the host and
# applies this spec idempotently (match Orca automation by `name`, compare its whole context and edit
# in place so the automation id stays stable).

name = "steward"          # Orca automation name; the match key across re-provisions
skill = "/steward"        # automation prompt = skill invocation (skill lives in .claude/skills/steward)
provider = "claude"
reuse_session = true
# Last resort only. The steward launches on `role_defaults.steward` in the selected head
# registry — the same table the dispatcher routes worker, reviewer and observer through — and
# runtime/dispatch.py resolves it through pipeline.health/heads the same way a worker head is
# resolved at claim time, walking the profile's fallback chain when its resource is red. This
# line answers only for a registry that routes the steward nowhere at all.
head = "codex-high"
# Skip the run unless the deterministic scan finds a real anomaly signal (new Blocked card,
# warn/error/head-health-flip line in the pipeline's own runs.jsonl, a card stuck past the
# staleness threshold, a resource health flip, a worker/reviewer workspace on disk with no
# in-flight card). Gated in the systemd unit, not Orca's field (manual `automations run` ignores
# --precheck). The steward's whole reason to exist is post-merge self-
# modification safety-netting, not a frequent LLM-cost sweep — a quiet tick costs nothing.
precheck = "python3 -m triggered_agents steward precheck"

[trigger]
# systemd is the sole schedule owner. Keep the equivalent cron recorded for GUI/manual context,
# but disable Orca's native trigger so a desktop/local scheduler cannot run a second steward in
# parallel with secretary-steward.timer. Manual `orca automations run` remains available.
orca = "0 */3 * * *"
enabled = false

[systemd]
# The actual scheduler on this headless box; the unit itself is packaged as
# packaging/systemd/secretary-<name>.timer and installed by `secretary reconcile apply`.
calendar = "00/3:00:00"
randomized_delay_sec = 150   # jitter so the three-hour sweep never races curator/board at :00-:03
# precheck hits Kanboard directly (signals.py), before any LLM head is up; ta-gate loads the
# steward allowlist through role-scoped runtime env.

# Second, unconditional mode (triggered-agents-254): once a day the head wakes up with NO
# precheck gate at all, regardless of whether signals.py found anything — the five signal
# detectors themselves can be blind (253: a wrong path made the pipeline log look permanently
# quiet), and a signal-gated wake-up can never catch that. the product ships a SECOND systemd unit (secretary-<name>-deep-sweep) alongside the three-hour one above —
# same worktree/workspace/head, no separate Orca automation. `skill` carries an argument
# ("deep-sweep") the same way a slash command would if typed by hand, so the one SKILL.md file
# can branch to its own section instead of the five-signal one; cli.py's deep-sweep-since/
# deep-sweep-advance keep this mode's watermark (last unconditional sweep) entirely separate
# from signals.py's per-kind watermark, so neither gate can starve the other of a wake-up.
[variants.deep-sweep]
skill = "/steward deep-sweep"

[variants.deep-sweep.systemd]
# Fixed, deliberately not-round time so it never coincides with retro's daily pass (00:00 +
# <=5min jitter, see retro/automation.toml) or the :00-:03 crowd (curator/pipeline).
# Time-only systemd OnCalendar shorthand (no date field, so no internal space). The timer itself is
# a static packaged unit (packaging/systemd/secretary-steward-deep-sweep.timer), installed by
# `secretary reconcile apply` / `secretary upgrade`; this field is the recorded canon that unit must
# match (and the cadence runtime/health.py reads for staleness). A space-separated `calendar` maps
# to one OnCalendar line per spec, the same convention pipeline/automation.toml uses for its
# two-offset 3-min cadence; keep any single spec free of an internal space so that split stays clean.
calendar = "03:47:00"
randomized_delay_sec = 600
