# Default head registry — a worker/reviewer head is data here, not the hardcoded `claude` binary
# in worker.py. A resource is a shared account/limit a head draws from (probe is a health-check
# command for that resource, run on a TTL by pipeline/health.py — red lives on the resource, every
# profile drawing from it inherits that redness). A profile names its resource, an adapter (which
# render_<adapter> in heads.py turns role+prompt into a launch command), and an ordered fallback
# chain of other profile ids health.resolve_head walks at claim time when the preferred profile's
# resource is red. An empty `fallback` means claim-skip: the card waits in Ready until the resource
# recovers instead of spending tokens on work that will not land.
#
# This file is the portable default: enough profiles to bring an installation up on a Claude or an
# OpenAI subscription, and no more. Which accounts a host actually pays for, which models it pins
# and how its roles are routed is installation configuration, so an installation states its own
# registry in `<instance>/heads/heads.toml` and that file wins over this one (heads.registry_path,
# secretary.head_registry.canonical_path). Adding a head is a new [profiles.<id>] entry plus, only
# if its launch shape is genuinely new, one more render_<adapter> function in heads.py — the
# dispatcher and worker.py never change.

[resources.claude-sub]
# A Claude subscription every claude-* profile below draws from — one account, no per-profile
# credential. Probe: one real haiku token through the OAuth-authenticated `claude` CLI
# (health.probe_claude_sub) — red exactly during a subscription rate-limit or an API outage, free
# the rest of the time (once per health.PROBE_TTL_S, not per tick).
account = "claude-subscription"
probe = "python3 -m triggered_agents pipeline probe --resource claude-sub"

[resources.openai-sub]
# The ChatGPT/OpenAI subscription codex draws from via its native `codex` CLI — one account, no
# per-profile credential, mirroring resources.claude-sub. Authed once with `codex login` (ChatGPT
# OAuth) into the Orca-managed CODEX_HOME (heads.CODEX_HOME), which also holds MCP, skills, hooks,
# and the global AGENTS.md. Probe: one real `codex exec` token through that home
# (health.probe_openai_sub) — red when the subscription is rate-limited or the CLI can't reach the
# API.
account = "openai-subscription"
probe = "python3 -m triggered_agents pipeline probe --resource openai-sub"

[resources.openrouter]
# Pay-per-token OpenRouter credit (key: ~/.hermes/.env open_router_key). Probe: one real 1-token
# chat completion (health.probe_openrouter) — red on a missing key, a non-2xx response, or a
# timeout. No default profile falls back to it: paid tokens are an installation's decision.
account = "openrouter-pooled-key"
probe = "python3 -m triggered_agents pipeline probe --resource openrouter"

[profiles.codex]
# Stable default/compatibility id for the native OpenAI Codex head (heads.DEFAULT_PROFILE): the
# profile a card gets when it names no head at all. No model_reasoning_effort override is passed,
# so Codex uses the model default.
resource = "openai-sub"
adapter = "codex"
model = "gpt-5.6-terra"
effort = "default"
fallback = []

[profiles.codex-terra]
# The same model under an explicit id, for a card that wants to pin it rather than inherit it.
resource = "openai-sub"
adapter = "codex"
model = "gpt-5.6-terra"
effort = "default"
fallback = []

[profiles.codex-high]
# Explicit high reasoning for harder implementation/debug cards.
resource = "openai-sub"
adapter = "codex"
model = "gpt-5.6-terra"
effort = "high"
fallback = []

[profiles.codex-extra]
# Extra reasoning (Codex CLI value: xhigh) for pipeline/core/system changes.
resource = "openai-sub"
adapter = "codex"
model = "gpt-5.6-terra"
effort = "extra"
fallback = []

[profiles.codex-tui]
# Interactive Codex worker profile. Same account and model as `codex`, but worker.py launches the
# TUI, waits for Orca `tui-idle`, then sends the task prompt into that live session.
resource = "openai-sub"
adapter = "codex"
model = "gpt-5.6-terra"
effort = "default"
codex_mode = "tui"
fallback = []

[profiles.codex-reviewer]
# Layer-3 reviewer: extra reasoning, with the other family as second priority so a red
# subscription does not stop review outright.
resource = "openai-sub"
adapter = "codex"
model = "gpt-5.6-terra"
effort = "extra"
fallback = ["claude-opus"]

[profiles.codex-observer]
# Sprint observer: one long-lived head per open sprint, launched by the dispatcher and held until
# the sprint closes. Extra reasoning like the reviewer — it slices cards and judges drift from the
# sprint goal, which is planning work rather than implementation. TUI rather than exec, because the
# observer is one continuous session for the whole sprint: a one-shot `codex exec` would exit after
# its first turn and the tick would read that as a dead head every time.
resource = "openai-sub"
adapter = "codex"
model = "gpt-5.6-terra"
effort = "extra"
codex_mode = "tui"
fallback = []

[profiles.claude-default]
# Bare `claude --dangerously-skip-permissions <skill>`, no --model flag: the CLI picks the model
# from its own settings. The launch shape for a host that pins nothing.
resource = "claude-sub"
adapter = "claude"
fallback = []

[profiles.claude-sonnet]
resource = "claude-sub"
adapter = "claude"
model = "sonnet"
fallback = []

[profiles.claude-opus]
resource = "claude-sub"
adapter = "claude"
model = "opus"
fallback = []

[profiles.hermes]
# Non-Anthropic, non-OpenAI head on pay-per-token credit. Deliberately absent from every default
# profile's fallback chain: an installation that wants a watcher of last resort spending real money
# opts into it in its own registry.
resource = "openrouter"
adapter = "hermes"
model = "openai/gpt-5.5"
provider = "openrouter"
fallback = []

[role_defaults]
# Installation snapshots are generated from this table together with resources/profiles. Keeping
# role routing in the same source prevents the production dispatcher and triggered-agents from
# selecting different generations. An installation that pays for one family only overrides the
# whole table in its own registry.
new_card = "codex"
reviewer = "codex-reviewer"
curator = "claude-sonnet"
steward = "claude-sonnet"
retro = "claude-sonnet"
observer = "codex-observer"
